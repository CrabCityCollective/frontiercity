       stichting. -->
  <defs>
    <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a22" />
      <stop offset="55%" stop-color="#6b4a30" />
      <stop offset="100%" stop-color="#8a5a34" />
    </linearGradient>
    <radialGradient id="gloed" cx="50%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#f2a84a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f2a84a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#lucht)" />

  <!-- verre bergketen -->
  <polygon points="0,420 160,300 340,400 520,280 700,410 900,320 1080,420 1280,360 1280,720 0,720" fill="#2c1c14" opacity="0.85" />
  <!-- naaste heuvels -->
  <polygon points="0,480 220,400 460,470 720,390 980,470 1280,420 1280,720 0,720" fill="#241510" />

  <!-- kampvuur-gloed -->
