<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Placeholder-plaatje (CLAUDE.md: grove/simpele placeholders zijn prima)
       voor het Going West-stichtingsmoment (issue #278, vraag 2). Donker,
       stoffig palet i.p.v. de warme Riven/Myst-tutorialsfeer, conform
       hoofdstuk 12 design-doc (Fallout/Diablo II-referentie voor de
